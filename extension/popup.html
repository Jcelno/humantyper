<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; width: 240px; padding: 14px; background: #0b0b10; color: #ececf1; font: 13px/1.5 system-ui, sans-serif; }
  b { font-weight: 600; } p { margin: 6px 0 12px; color: #8a8a98; }

</style></head>
